name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装校验依赖
        run: pip install jsonschema

      # 数据集有问题就不能发布：区间文本与数值不一致、三维基准超出数据区间、
      # 改了 towers.json 忘了重新生成 d_towers.gen.js，都会在这里拦下。
      - name: 校验塔型数据集
        run: python assets/data/validate.py

      - name: 构建单文件页面
        run: python assets/ui/build_site.py

      - name: 整理发布目录
        run: |
          mkdir -p _site
          cp "铁塔大全.html" _site/index.html
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
